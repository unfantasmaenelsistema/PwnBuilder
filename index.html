<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PwnBuilder · Un Fantasma en el Sistema</title>
<meta name="description" content="Generador de comandos para 42 herramientas de pentesting y CTF (nmap, hydra, sqlmap, hashcat, aircrack-ng, Metasploit…). Monta el comando marcando opciones. Para uso autorizado. 100% en el navegador.">
<link rel="icon" href="icono.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00ff88">
<script>
  // Tema antes de pintar, para que no parpadee
  (function(){var t=null;try{t=localStorage.getItem('pwn-theme');}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener" class="logo">
    <img src="icono.png" alt="Un Fantasma en el Sistema">
    <span>Pwn<b>Builder</b></span>
  </a>
  <div class="hdr-right">
    <a href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener" class="site-link">unfantasmaenelsistema.com</a>
    <button id="langToggle" class="hdr-btn" type="button">EN</button>
    <button id="themeToggle" class="hdr-btn" type="button">☀</button>
  </div>
</header>

<main>
  <section class="intro">
    <h1 data-i18n="tagline">Generador de comandos para pentesting y CTF</h1>
    <p class="lead" data-i18n-html="lead"></p>
    <div class="ethics" data-i18n-html="ethics"></div>
  </section>

  <section class="cmd-bar">
    <div class="cmd" id="cmd">$</div>
    <button class="btn" id="copyBtn" data-i18n="copy" disabled></button>
  </section>
  <p class="note inc" id="incNote" data-i18n="incomplete" hidden></p>

  <div class="layout">
    <aside class="side">
      <input id="search" class="search" type="search" spellcheck="false" placeholder="Buscar herramienta…">
      <div id="toolList" class="toollist"></div>
    </aside>
    <section class="card" id="panel"></section>
  </div>
</main>

<footer class="site-footer">
  <a href="https://www.unfantasmaenelsistema.com" target="_blank" rel="noopener" class="footer-brand">
    <img src="icono.png" alt="Un Fantasma en el Sistema" width="28" height="28">
    <span><b>Un Fantasma en el Sistema</b><small>unfantasmaenelsistema.com</small></span>
  </a>
  <div class="footer-links">
    <span data-i18n="fLocal"></span><span>·</span>
    <a href="https://github.com/unfantasmaenelsistema/PwnBuilder" target="_blank" rel="noopener">GitHub</a><span>·</span><span>MIT</span>
  </div>
</footer>

<script src="tools.js"></script>
<script src="app.js"></script>
</body>
</html>
